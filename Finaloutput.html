<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduQuiz Battle – 12th TN Board | MCQ + Flash Cards</title>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Space+Mono:wght@400;700&family=Hind:wght@400;600;700&display=swap" rel="stylesheet">
    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #FF6B35; --secondary: #F7931E; --accent: #FDC830;
            --dark: #1a1a2e; --correct: #00D9A3; --wrong: #FF3366;
            --bookback: #FF6B6B; --bookinside: #4ECDC4; --overall: #45B7D1;
            --chemistry: #667eea; --physics: #48c774; --biology: #ff9f43;
            --zoology: #e84342; --commerce: #a55eea;
        }
        body {
            font-family: 'Space Mono', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex; align-items: center;
            justify-content: center; overflow-x: hidden; position: relative; padding: 10px;
        }
        .particle { position: absolute; width: 4px; height: 4px; background: rgba(255,255,255,0.5); border-radius: 50%; animation: float 15s infinite; }
        @keyframes float { 0%,100%{transform:translateY(0) translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-100vh) translateX(100px);opacity:0} }
        .lang-toggle {
            position: fixed; top: 15px; right: 15px; z-index: 1000;
            background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
            padding: 5px; border-radius: 50px; box-shadow: 0 8px 32px rgba(0,0,0,0.18);
            display: flex; gap: 4px; border: 2px solid rgba(255,107,53,0.3);
        }
        .lang-option { padding: 8px 20px; border-radius: 40px; cursor: pointer; transition: all 0.3s; color: #1e293b; font-size: 0.9rem; font-family:'Hind',sans-serif; font-weight:600; user-select:none; }
        .lang-option.active { background: linear-gradient(135deg,var(--primary),var(--secondary)); color:white; box-shadow:0 4px 12px rgba(255,107,53,0.4); }
        .game-container { width:95%; max-width:1100px; background:rgba(255,255,255,0.97); border-radius:30px; padding:30px; box-shadow:0 30px 60px rgba(0,0,0,0.3); position:relative; z-index:10; animation:slideUp 0.6s ease-out; margin:10px; max-height:98vh; overflow-y:auto; }
        @keyframes slideUp { from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)} }
        .header { text-align:center; margin-bottom:25px; }
        .title { font-family:'Righteous',cursive; font-size:2.8em; background:linear-gradient(135deg,var(--primary),var(--secondary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:5px; animation:glow 2s ease-in-out infinite; }
        @keyframes glow { 0%,100%{filter:drop-shadow(0 0 10px rgba(255,107,53,0.5))}50%{filter:drop-shadow(0 0 20px rgba(255,107,53,0.8))} }
        .subtitle { color:#666; font-size:1.05em; font-family:'Hind',sans-serif; }
        .mode-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin:30px 0; }
        .mode-card { background:white; border-radius:20px; padding:25px 15px; text-align:center; cursor:pointer; transition:all 0.4s; border:3px solid transparent; box-shadow:0 15px 30px rgba(0,0,0,0.1); position:relative; overflow:hidden; }
        .mode-card::before { content:''; position:absolute; top:0; left:0; right:0; height:5px; background:linear-gradient(90deg,var(--primary),var(--secondary)); transform:scaleX(0); transition:transform 0.3s; }
        .mode-card:hover::before { transform:scaleX(1); }
        .mode-card:hover { transform:translateY(-10px) scale(1.02); box-shadow:0 20px 40px rgba(0,0,0,0.2); }
        .mode-icon { width:80px; height:80px; margin:0 auto 15px; background:linear-gradient(135deg,var(--primary),var(--secondary)); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:40px; color:white; transition:all 0.3s; }
        .mode-card:hover .mode-icon { transform:rotate(360deg) scale(1.1); }
        .mode-card h3 { font-size:1.3em; color:var(--dark); margin-bottom:8px; font-family:'Hind',sans-serif; }
        .mode-card p { color:#666; font-size:0.88em; margin-bottom:15px; font-family:'Hind',sans-serif; }
        .mode-badge { display:inline-block; padding:5px 15px; background:linear-gradient(135deg,var(--accent),var(--primary)); color:white; border-radius:20px; font-size:0.78em; font-weight:bold; font-family:'Hind',sans-serif; }
      .subject-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:15px; margin:20px 0; }
        .subject-card { background:white; border-radius:15px; padding:20px 10px; text-align:center; cursor:pointer; transition:all 0.3s; border:2px solid transparent; box-shadow:0 8px 15px rgba(0,0,0,0.1); position:relative; overflow:hidden; }
        .subject-card::after { content:''; position:absolute; top:0; left:0; width:100%; height:100%; background:linear-gradient(135deg,transparent,rgba(255,255,255,0.3)); transform:translateX(-100%); transition:transform 0.3s; }
        .subject-card:hover::after { transform:translateX(0); }
        .subject-card:hover { transform:translateY(-5px) scale(1.02); border-color:var(--primary); box-shadow:0 15px 30px rgba(255,107,53,0.2); }
        .subject-icon { width:60px; height:60px; margin:0 auto 12px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; color:white; transition:all 0.3s; }
        .subject-card[data-subject="chemistry"] .subject-icon { background:var(--chemistry); }
        .subject-card[data-subject="physics"] .subject-icon { background:var(--physics); }
        .subject-card[data-subject="biology"] .subject-icon { background:var(--biology); }
        .subject-card[data-subject="zoology"] .subject-icon { background:var(--zoology); }
        .subject-card[data-subject="commerce"] .subject-icon { background:var(--commerce); }
        .subject-card[data-subject="accountancy"] .subject-icon { background:#0e9f6e; }
        .subject-card[data-subject="computerscience"] .subject-icon { background:#7c3aed; }
        .subject-card h4 { font-size:1.05em; color:var(--dark); margin-bottom:5px; font-family:'Hind',sans-serif; }
        .subject-card p { color:#888; font-size:0.78em; font-family:'Hind',sans-serif; }
        .chapter-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:15px; margin:20px 0; }
        .chapter-card { background:white; border-radius:15px; padding:18px 15px 15px 20px; text-align:left; cursor:pointer; transition:all 0.3s; border:2px solid #eee; box-shadow:0 6px 15px rgba(0,0,0,0.08); position:relative; overflow:hidden; }
        .chapter-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:5px; background:linear-gradient(180deg,var(--primary),var(--secondary)); border-radius:15px 0 0 15px; }
        .chapter-card:hover { transform:translateY(-4px); border-color:var(--primary); box-shadow:0 12px 25px rgba(255,107,53,0.2); }
        .chapter-card.locked { opacity:0.6; }
        .chapter-num { font-size:0.72em; font-weight:bold; color:var(--primary); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; font-family:'Space Mono',monospace; }
        .chapter-name { font-size:0.98em; font-weight:700; color:var(--dark); margin-bottom:3px; font-family:'Hind',sans-serif; line-height:1.3; }
        .chapter-qcount { font-size:0.76em; color:#999; margin-top:8px; font-family:'Hind',sans-serif; }
        .chapter-badge { position:absolute; top:10px; right:10px; font-size:0.68em; padding:2px 8px; border-radius:10px; font-family:'Hind',sans-serif; font-weight:600; }
        .chapter-badge.avail { background:linear-gradient(135deg,#00D9A3,#00b386); color:white; }
        .chapter-badge.soon { background:#f0f0f0; color:#999; }
        .category-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:15px; margin:25px 0; }
        .category-card { background:white; border-radius:15px; padding:20px 15px; text-align:center; box-shadow:0 8px 20px rgba(0,0,0,0.1); cursor:pointer; transition:all 0.3s; border:2px solid transparent; }
        .category-card:hover { transform:translateY(-5px); box-shadow:0 12px 25px rgba(102,126,234,0.3); border-color:var(--primary); }
        .category-card.book-back { border-left:5px solid var(--bookback); }
        .category-card.book-inside { border-left:5px solid var(--bookinside); }
        .category-card.overall { border-left:5px solid var(--overall); }
        .category-card h3 { color:#333; margin:10px 0; font-size:1.05em; font-family:'Hind',sans-serif; }
        .category-card p { color:#666; font-size:0.82em; margin:5px 0; font-family:'Hind',sans-serif; }
        .category-icon { width:50px; height:50px; margin:0 auto; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:bold; }
        .book-back .category-icon { background:var(--bookback); color:white; }
        .book-inside .category-icon { background:var(--bookinside); color:white; }
        .overall .category-icon { background:var(--overall); color:white; }
        .stats-badge { margin-top:8px; font-size:0.78em; color:#888; font-family:'Hind',sans-serif; }
        .priority-high { color:#FF6B35; font-weight:bold; }
        .back-btn { padding:10px 22px; border:none; border-radius:25px; background:#ff4757; color:white; cursor:pointer; font-size:0.92em; transition:all 0.3s; font-family:'Hind',sans-serif; font-weight:600; margin:12px 0; display:inline-block; }
        .back-btn:hover { background:#ff6b81; transform:translateY(-2px); box-shadow:0 5px 15px rgba(255,71,87,0.3); }
        .quiz-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px; }
        .quiz-info { background:linear-gradient(135deg,#667eea,#764ba2); color:white; padding:8px 15px; border-radius:20px; font-size:0.82em; font-family:'Hind',sans-serif; }
        .stats { display:flex; justify-content:space-around; margin-bottom:20px; gap:10px; }
        .stat-box { flex:1; padding:12px 8px; background:linear-gradient(135deg,var(--primary),var(--secondary)); border-radius:12px; color:white; text-align:center; transition:transform 0.3s; }
        .stat-box:hover { transform:perspective(1000px) rotateX(5deg) scale(1.02); }
        .stat-label { font-size:0.76em; opacity:0.9; font-family:'Hind',sans-serif; }
        .stat-value { font-size:1.5em; font-weight:bold; margin-top:3px; }
        .progress-bar { height:8px; background:#e0e0e0; border-radius:8px; overflow:hidden; margin-bottom:20px; }
        .progress-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--primary)); width:0%; transition:width 0.5s ease; }
      .question-card { background:white; padding:20px; border-radius:15px; box-shadow:0 8px 20px rgba(0,0,0,0.1); margin-bottom:20px; border:2px solid var(--primary); }
        .question-text { font-size:1.08em; font-weight:bold; color:var(--dark); margin-bottom:20px; line-height:1.6; font-family:'Hind',sans-serif; }
        .options-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .option-btn { padding:13px 10px; border:2px solid #ddd; border-radius:10px; background:white; font-family:'Hind',sans-serif; font-size:0.93em; cursor:pointer; transition:all 0.3s; text-align:left; line-height:1.4; }
        .option-btn:hover { transform:scale(1.02); border-color:var(--primary); box-shadow:0 5px 12px rgba(255,107,53,0.3); }
        .option-btn.correct { background:var(--correct); color:white; border-color:var(--correct); animation:correctPulse 0.5s; }
        .option-btn.wrong { background:var(--wrong); color:white; border-color:var(--wrong); animation:shake 0.5s; }
        @keyframes correctPulse { 0%,100%{transform:scale(1)}50%{transform:scale(1.05)} }
        @keyframes shake { 0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)} }
        .explanation { background:#f8f9ff; border-left:4px solid #667eea; padding:15px; border-radius:8px; margin:15px 0; display:none; font-size:0.9em; font-family:'Hind',sans-serif; line-height:1.6; }
        .explanation.show { display:block; }
        .explanation .correct-ans { color:#4CAF50; font-weight:bold; }
        .explanation .wrong-ans { color:#ff4757; }
        .timer { position:absolute; top:15px; right:15px; width:60px; height:60px; border-radius:50%; background:conic-gradient(var(--accent) 0deg,transparent 0deg); display:flex; align-items:center; justify-content:center; font-size:1.5em; font-weight:bold; color:var(--dark); }
        .timer-inner { width:50px; height:50px; background:white; border-radius:50%; display:flex; align-items:center; justify-content:center; }
        .streak-badge { position:absolute; top:-10px; left:50%; transform:translateX(-50%); background:var(--accent); color:var(--dark); padding:5px 15px; border-radius:20px; font-weight:bold; font-size:0.82em; box-shadow:0 3px 10px rgba(253,200,48,0.5); z-index:20; font-family:'Hind',sans-serif; white-space:nowrap; }
        .nav-buttons { display:flex; justify-content:space-between; margin-top:15px; }
        .nav-btn { padding:10px 20px; border:none; border-radius:20px; background:linear-gradient(135deg,#667eea,#764ba2); color:white; cursor:pointer; font-size:0.88em; transition:all 0.3s; font-family:'Hind',sans-serif; font-weight:600; }
        .nav-btn:disabled { opacity:0.5; cursor:not-allowed; }
        .nav-btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 5px 12px rgba(102,126,234,0.4); }
        .submit-btn { background:linear-gradient(135deg,#4CAF50,#45a049); width:100%; margin-top:15px; }
        .confetti { position:absolute; width:8px; height:8px; background:var(--accent); animation:confettiFall 3s linear infinite; }
        @keyframes confettiFall { to{transform:translateY(100vh) rotate(360deg);opacity:0} }
        .result { text-align:center; padding:30px; background:linear-gradient(135deg,#667eea,#764ba2); color:white; border-radius:15px; margin-top:20px; font-size:1.2em; font-family:'Hind',sans-serif; }
        .section-divider { text-align:center; margin:10px 0 20px; color:#888; font-size:0.85em; font-family:'Hind',sans-serif; }
        .section-divider::before, .section-divider::after { content:''; display:inline-block; width:40px; height:1px; background:#ddd; vertical-align:middle; margin:0 10px; }
        @media(max-width:768px) { .game-container{padding:15px;width:100%} .title{font-size:2em} .mode-grid{grid-template-columns:1fr} .category-grid{grid-template-columns:1fr} .options-grid{grid-template-columns:1fr} .subject-grid{grid-template-columns:repeat(2,1fr)} .chapter-grid{grid-template-columns:1fr} .timer{width:50px;height:50px;font-size:1.2em} .timer-inner{width:40px;height:40px} .lang-toggle{top:10px;right:10px} }
    

        /* ─── Flashcard mode additions ─── */
      :root {
            --botany: #2d8a4e;    --botany-light: #e8f5ec;
            --zoology: #e84342;   --zoology-light: #fdeaea;
            --physics: #1565c0;   --physics-light: #e3f0fb;
            --chemistry: #667eea; --chemistry-light: #eef0fd;
        }

        /* subject selection: highlight available subjects */
        .subject-card[data-subject="botany"]   .subject-icon { background: var(--botany); }
        .subject-card[data-subject="physics"]  .subject-icon { background: var(--physics); }
        .subject-card[data-subject="zoology"]  .subject-icon { background: var(--zoology); }
        .subject-card.flash-avail { cursor: pointer; }
        .subject-card.flash-avail:hover { border-color: var(--primary); }

        /* ─── Flash section wrapper ─── */
        #flashSection { display: none; }

        .flash-subject-header {
            display: flex; align-items: center; gap: 14px;
            margin-bottom: 20px;
        }
        .flash-subject-badge {
            padding: 6px 18px; border-radius: 30px;
            font-family: 'Space Mono', monospace;
            font-size: 0.78em; font-weight: 700; color: white;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .flash-subject-badge.chemistry { background: var(--chemistry); }
        .flash-subject-badge.botany    { background: var(--botany); }
        .flash-subject-badge.zoology   { background: var(--zoology); }
        .flash-subject-badge.physics   { background: var(--physics); }

        /* unit accordion */
        .flash-unit { margin-bottom: 18px; border-radius: 18px; overflow: hidden;
                      box-shadow: 0 6px 20px rgba(0,0,0,0.09); }
        .flash-unit-header {
            display: flex; align-items: center; gap: 14px;
            padding: 16px 20px; cursor: pointer;
            background: white; border: 2px solid #eee;
            border-radius: 18px; transition: all 0.3s;
            user-select: none;
        }
        .flash-unit-header:hover { border-color: var(--primary);
            box-shadow: 0 4px 14px rgba(255,107,53,0.15); }
        .flash-unit-header.open { border-radius: 18px 18px 0 0; border-bottom: none; }

        .unit-code-badge {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white; font-family: 'Space Mono', monospace;
            font-size: 0.78em; font-weight: 700;
          padding: 4px 14px; border-radius: 20px; white-space: nowrap;
        }
        .unit-name-text { font-family: 'Hind', sans-serif; font-size: 1.05em;
            font-weight: 700; color: var(--dark); flex: 1; }
        .unit-card-count { font-family: 'Hind', sans-serif; font-size: 0.82em;
            color: #999; margin-right: 6px; }
        .unit-chevron { font-size: 1.2em; color: var(--primary);
            transition: transform 0.3s; }
        .flash-unit-header.open .unit-chevron { transform: rotate(180deg); }

        .flash-cards-panel {
            display: none; padding: 20px;
            background: #fafafa; border: 2px solid #eee;
            border-top: none; border-radius: 0 0 18px 18px;
        }
        .flash-cards-panel.open { display: block; }

        /* shuffle button inside panel */
        .shuffle-btn {
            display: inline-flex; align-items: center; gap: 6px;
